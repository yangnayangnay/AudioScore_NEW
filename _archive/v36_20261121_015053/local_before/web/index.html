<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AudioScore · 音频转 MIDI</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --txt:#e8eaf0;
          --dim:#8b93a3; --acc:#5b8cff; --ok:#3ecf8e; --err:#ff6b6b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font-family:system-ui,
         "PingFang SC","Microsoft YaHei",sans-serif; min-height:100vh; }
  .wrap { max-width:720px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:22px; margin-bottom:4px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:24px; }
  .card { background:var(--card); border:1px solid var(--line);
          border-radius:12px; padding:20px; margin-bottom:16px; }
  #drop { border:2px dashed var(--line); border-radius:10px; padding:36px 16px;
          text-align:center; cursor:pointer; transition:.2s; }
  #drop.on { border-color:var(--acc); background:#1c2230; }
  #drop .big { font-size:15px; margin-bottom:6px; }
  #drop .small { color:var(--dim); font-size:12px; }
  label { display:block; font-size:13px; color:var(--dim); margin:14px 0 6px; }
  select,input[type=number] { width:100%; background:#11141a; color:var(--txt);
    border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:14px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:1px solid var(--line); border-radius:999px; padding:5px 13px;
          font-size:12px; cursor:pointer; user-select:none; color:var(--dim); }
  .chip.on { border-color:var(--acc); color:var(--acc); background:#1c2536; }
  .row { display:flex; gap:16px; flex-wrap:wrap; }
  .row>div { flex:1; min-width:150px; }
  .opt { display:flex; align-items:center; gap:8px; font-size:13px;
         color:var(--txt); margin-top:10px; }
  button.go { width:100%; margin-top:20px; padding:13px; font-size:15px;
    border:none; border-radius:10px; background:var(--acc); color:#fff;
    font-weight:600; cursor:pointer; }
  button.go:disabled { opacity:.45; cursor:not-allowed; }
  #status { display:none; }
  .stage { font-size:14px; margin-bottom:8px; }
  .bar { height:6px; background:#11141a; border-radius:3px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--acc); width:0%;
           transition:width .5s; border-radius:3px; }
  .meta { color:var(--dim); font-size:12px; margin-top:8px; }
  .err { color:var(--err); font-size:13px; white-space:pre-wrap;
         max-height:200px; overflow:auto; margin-top:8px; }
  a.dl { display:block; text-align:center; margin-top:16px; padding:13px;
    border-radius:10px; background:var(--ok); color:#06281a; font-weight:700;
    text-decoration:none; font-size:15px; }
  .hist { font-size:12px; color:var(--dim); margin-top:12px; line-height:1.9; }
  .hist a { color:var(--acc); }
</style>
</head>
<body>
<div class="wrap">
  <h1>AudioScore</h1>
  <div class="sub">本地 AI 音频转 MIDI · MuScriptor / Basic Pitch · RTX 4070</div>

  <div class="card">
    <div id="drop">
      <div class="big" id="fname">点击选择或拖入音频文件</div>
      <div class="small" id="fmeta">支持 mp3 / wav / flac / ogg，≤200MB</div>
    </div>
    <input type="file" id="file" accept="audio/*" hidden>
  </div>

  <div class="card">
    <label>转写后端</label>
    <select id="backend"></select>
    <label>乐器约束（全不选 = 自动检测所有乐器；选中可抑制乐器识别漂移）</label>
    <div class="chips" id="chips"></div>
    <div class="row">
      <div>
        <label>BPM（留空 = 自动检测）</label>
        <input type="number" id="bpm" placeholder="auto" min="30" max="300">
      </div>
    </div>
    <label>时间上限（超时自动终止该任务）</label>
<select id="tmo">
  <option value="">默认（config.yaml）</option>
  <option value="600">10 分钟</option>
  <option value="1800">30 分钟</option>
  <option value="3600">1 小时</option>
  <option value="7200">2 小时</option>
  <option value="0">无限制</option>
</select>
<div class="opt"><input type="checkbox" id="pp1" checked><label>重叠分片去重（跨 5s 分片重复音符合并）</label></div>
    <div class="opt"><input type="checkbox" id="pp2" checked><label>碎音符过滤（&lt;60ms）</label></div>
    <div class="opt"><input type="checkbox" id="pp3"><label>力度重建（基于原始音频能量）</label></div>
<div class="opt"><input type="checkbox" id="pp4"><label>音色预分离分轨转写（有Demucs用ML；无Demucs自动DSP，零安装）</label></div>
<div class="opt"><input type="checkbox" id="pp5"><label>智能乐器识别（自动听音选乐器 Smart auto）</label></div>

<div class="opt"><input type="checkbox" id="pp7"><label>节拍网格量化（十六分音符对齐 Quantize）</label></div>


<div class="opt"><input type="checkbox" id="pp10"><label>拍号识别（4/4·3/4·6/8 强拍位分析 Meter）</label></div>
<div class="opt"><input type="checkbox" id="pp11"><label>静音留白（长间隙裁音符 Silence rest）</label></div>

<div class="opt"><input type="checkbox" id="pp13"><label>衰减时值（钢琴快衰/弦乐慢衰 Decay aware）</label></div>



    <button class="go" id="go" disabled>开始转写</button>
  </div>

  <div class="card" id="status">
    <div class="stage" id="stage">排队中…</div>
    <div class="bar"><i id="pbar"></i></div>
    <div class="meta" id="smeta"></div>
    <div class="err" id="serr"></div>
    <a class="dl" id="dl" style="display:none" download>⬇ 下载 MIDI 文件</a>
    <div class="hist" id="hist"></div>
  </div>
</div>

<script>
let file = null, poller = null, history = [];
const $ = id => document.getElementById(id);
const ZH = {piano:'钢琴', bass:'贝斯', drums:'架子鼓', guitar:'吉他', electric_guitar:'电吉他', strings:'弦乐', violin:'小提琴', cello:'大提琴', brass:'铜管', trumpet:'小号', saxophone:'萨克斯', flute:'长笛', organ:'管风琴', synth_lead:'合成主音', synth_pad:'合成铺底', vocals:'人声'};

// 初始化后端与乐器
fetch('/api/backends').then(r => r.json()).then(d => {
  const sel = $('backend');
  d.backends.forEach(b => {
    const o = document.createElement('option');
    o.value = b.name;
    o.textContent = (b.available ? '' : '【未安装】') +
      (b.name === 'muscriptor' ? 'MuScriptor（多乐器·推荐）' : 'Basic Pitch（单轨·轻量）');
    o.disabled = !b.available;
    sel.appendChild(o);
  });
  const chips = $('chips');
  d.instruments.forEach(name => {
    const c = document.createElement('span');
    c.className = 'chip'; c.dataset.value = name;
c.textContent = (ZH[name] ? ZH[name] + ' ' : '') + name;
    c.onclick = () => c.classList.toggle('on');
    chips.appendChild(c);
  });
});

// 上传交互
const drop = $('drop'), fi = $('file');
drop.onclick = () => fi.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('on'); };
drop.ondragleave = () => drop.classList.remove('on');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('on'); pick(e.dataTransfer.files[0]); };
fi.onchange = () => pick(fi.files[0]);
function pick(f) {
  if (!f) return;
  file = f;
  $('fname').textContent = f.name;
  $('fmeta').textContent = (f.size / 1048576).toFixed(1) + ' MB';
  $('go').disabled = false;
}

// 提交
$('go').onclick = async () => {
  if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  fd.append('backend', $('backend').value);
  fd.append('instruments', [...document.querySelectorAll('.chip.on')]
            .map(c => c.dataset.value || c.textContent).join(','));
  const bpm = $('bpm').value.trim();
  if (bpm) fd.append('bpm', bpm);
var _OF = {pp1: 'dedup', pp2: 'frag', pp3: 'vel', pp4: 'demucs', pp5: 'smart', pp6: 'harmonic',pp7: 'quant', pp8: 'split', pp9: 'fit', pp10: 'meter', pp11: 'rest', pp12: 'onsnap', pp13: 'decay', pp14: 'dyn', pp15: 'dur', pp16: 'dtw'}, _on = [];
for (var k in _OF) { var e = document.getElementById(k); if (e && e.checked) _on.push(_OF[k]); }
fd.append('post', _on.join(','));
const tmo = $('tmo').value;
if (tmo !== '') fd.append('timeout', tmo);
  // 后处理开关同步到说明: 服务端读 config.yaml; 这里至少写进缓存 key 的提示由后端处理
  const r = await fetch('/api/jobs', { method: 'POST', body: fd });
  const d = await r.json();
  if (!r.ok) { alert(d.detail || '提交失败'); return; }
  $('status').style.display = 'block';
  $('dl').style.display = 'none'; $('serr').textContent = '';
  poll(d.job_id);
};

function poll(id) {
  clearInterval(poller);
  poller = setInterval(async () => {
    const j = await (await fetch('/api/jobs/' + id)).json();
    $('stage').textContent = '【' + j.backend + '】' + j.stage + (j.cached ? '（缓存命中）' : '');
    $('pbar').style.width =
      ({ queued: 5, running: 40, done: 100, error: 100 })[j.status] + '%';
    $('smeta').textContent = '已用时 ' + j.elapsed + 's';
    if (j.status === 'done') {
      clearInterval(poller);
      if (j.stats) $('smeta').textContent +=
        ` · ${j.stats.notes} 音符 · ${j.stats.tracks} 轨 · ${j.stats.duration}s`;
      const a = $('dl'); a.href = j.result_url;
      a.style.display = 'block';
      a.textContent = `⬇ 下载 MIDI（${j.stats.notes} 音符）`;
      history.unshift(`<a href="${j.result_url}">${id}</a> · ${j.stats.notes}音符 · ${j.elapsed}s`);
      $('hist').innerHTML = '本次会话: ' + history.slice(0, 5).join('｜');
    } else if (j.status === 'error') {
      clearInterval(poller);
      $('serr').textContent = j.error || '未知错误';
    }
  }, 2000);
}
</script>


<script>
(function(){
'use strict';
var QKEY='as_queue_state',PENDKEY='as_pending_dl',DLSET='as_dl_done',ARCH='as_run_archive';
var PPS=['pp1','pp2','pp3','pp4','pp5','pp6','pp7','pp8','pp9','pp10','pp11','pp12','pp13','pp14','pp15','pp16'];
function el(id){return document.getElementById(id);}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);
  if(v===null){localStorage.removeItem(k);return null;}localStorage.setItem(k,v);}
  catch(e){return null;}}
function jsGet(k,d){try{var v=JSON.parse(localStorage.getItem(k)||'null');
  return v==null?d:v;}catch(e){return d;}}
function jsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function toast(m){var t=el('asToast');
  if(!t){t=document.createElement('div');t.id='asToast';
    t.style.cssText='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);'+
    'background:#333;color:#fff;padding:8px 16px;border-radius:6px;font-size:13px;z-index:10000';
    document.body.appendChild(t);}
  t.textContent=m;t.style.opacity='1';
  clearTimeout(t.__h);t.__h=setTimeout(function(){t.style.opacity='0';},3200);}
function DLURL(j){if(!j)return '';var c=[j.download_url,j.download,j.file_url,j.file,
  j.url,j.midi,j.midi_url,j.result_url,j.result];
  for(var i=0;i<c.length;i++)if(typeof c[i]==='string'&&c[i])return c[i];return '';}
function outName(on){var b=(on||'').replace(/\.[^.]+$/,'');if(!b)b='output';
  if(/audioscore$/i.test(b))return b+'.mid';return b+'AudioScore.mid';}
function precMode(){return ls('as_prec')||'std';}
function smartFragOn(){return ls('as_g_smartfrag')!=='0';}
function postprocBlob(blob,cb){
  if(!smartFragOn()){cb(blob);return;}
  var fd=new FormData();fd.append('file',blob,'m.mid');
  fd.append('pp17','1');fd.append('pp18','1');
  fetch('/api/postproc',{method:'POST',body:fd})
  .then(function(r){return r.blob();}).then(cb)
  .catch(function(){cb(blob);});}
function saveBlob(url,fn,cb){fetch(url).then(function(r){return r.blob();})
  .then(function(bl){return new Promise(function(res){
    if(smartFragOn()){postprocBlob(bl,function(p){res(p);});}
    else res(bl);});})
  .then(function(bl){var u=URL.createObjectURL(bl);var t=document.createElement('a');
  t.href=u;t.download=fn;document.body.appendChild(t);t.click();t.remove();
  setTimeout(function(){URL.revokeObjectURL(u);},4000);if(cb)cb(true);})
  .catch(function(){if(cb)cb(false);});}
function buildZip(items){
  var CT=(function(){var t=[],c,n,k;for(n=0;n<256;n++){c=n;
    for(k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
  function crc32(u8){var c=0xFFFFFFFF,i;
    for(i=0;i<u8.length;i++)c=CT[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
  var enc=new TextEncoder();
  function w16(v){return [v&255,(v>>>8)&255];}
  function w32(v){return [v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];}
  return Promise.all(items.map(function(it){
    return it.blob.arrayBuffer().then(function(ab){
      return {name:it.name,u8:new Uint8Array(ab)};});}))
  .then(function(files){
    var parts=[],central=[],off=0;
    files.forEach(function(f){
      var n=f.u8.length,c=crc32(f.u8),nb=enc.encode(f.name);
      var lh=[].concat(w32(0x04034b50),w16(20),w16(0x0800),w16(0),w16(0),w16(0),
        w32(c),w32(n),w32(n),w16(nb.length),w16(0));
      parts.push(new Uint8Array(lh),nb,f.u8);
      var cd=[].concat(w32(0x02014b50),w16(20),w16(20),w16(0x0800),w16(0),w16(0),
        w16(0),w32(c),w32(n),w32(n),w16(nb.length),w16(0),w16(0),w16(0),w16(0),
        w32(0),w32(off));
      central.push(new Uint8Array(cd),nb);
      off+=lh.length+nb.length+n;});
    var cdSize=central.reduce(function(a,x){return a+x.length;},0);
    var eo=new Uint8Array([].concat(w32(0x06054b50),w16(0),w16(0),w16(files.length),
      w16(files.length),w32(cdSize),w32(off),w16(0)));
    return new Blob(parts.concat(central,[eo]),{type:'application/zip'});});
}
function fmtMs(ms){var s2=Math.round(ms/1000);var m=Math.floor(s2/60);s2=s2%60;
  return m>0?m+'\u5206'+(s2<10?'0':'')+s2+'\u79d2':s2+'\u79d2';}
function saveOpts(){var o={};PPS.forEach(function(id){var e=el(id);if(e)o[id]=!!e.checked;});
  var be=el('backend');if(be)o.backend=be.value;jsSet('as_opts',o);}
(function(){var o=jsGet('as_opts',{});
  PPS.forEach(function(id){var e=el(id);if(e&&(id in o))e.checked=!!o[id];});
  var be=el('backend');if(be&&o.backend)be.value=o.backend;})();
PPS.forEach(function(id){var e=el(id);if(e)e.addEventListener('change',saveOpts);});
var be=el('backend');if(be)be.addEventListener('change',saveOpts);
var input=document.querySelector('input[type="file"]');
if(input)try{input.multiple=true;}catch(e){}
var btn=null,autoPass=false,logOpen=false;
var cands=document.querySelectorAll('button,input[type="button"],input[type="submit"]');
for(var i=0;i<cands.length;i++){var t=((cands[i].textContent||'')+(cands[i].value||'')).trim();
  if(/\u5f00\u59cb|\u8f6c\u6362|\u8f6c\u5199/.test(t)){btn=cands[i];break;}}
function lockBtn(on){if(!btn)return;
  btn.style.opacity=on?'0.45':'';
  btn.style.pointerEvents=on?'none':'';
  btn.style.cursor=on?'not-allowed':'';}
var obar=document.createElement('div');obar.id='asOverallWrap';
obar.style.cssText='display:flex;align-items:center;gap:10px;margin:10px 0 6px';
obar.innerHTML='<span id="asOCount" style="font-size:12px;opacity:.65;white-space:nowrap"></span>'+
 '<div style="flex:1;height:6px;background:#2a2f3a;border-radius:3px;overflow:hidden">'+
 '<div id="asQOBar" style="height:100%;width:0;background:#5b8dd6;transition:width .4s"></div></div>'+
 '<span id="asQEta" style="font-size:12px;opacity:.6;white-space:nowrap"></span>';
var panel=document.createElement('div');panel.id='asQueuePanel';
panel.style.cssText='border:1px solid #3a3f4a;border-radius:8px;padding:8px 12px;'+
 'margin:6px 0 10px;position:sticky;top:0;z-index:500;background:rgba(16,18,24,.97);'+
 'box-shadow:0 2px 10px rgba(0,0,0,.35)';
panel.innerHTML='<div style="display:flex;align-items:center;gap:8px">'+
 '<span style="font-weight:600">\u8f6c\u6362\u961f\u5217</span>'+
 '<span id="asQFold" style="cursor:pointer;opacity:.7;padding:0 4px">\u25be</span>'+
 '<span id="asQLog" style="cursor:pointer;font-size:12px;color:#8ab4e0">\u65e5\u5fd7</span>'+
 '<span id="asQSet" style="cursor:pointer;font-size:12px;color:#9fb0c0">\u2699 \u8bbe\u7f6e</span>'+
 '<span id="asQEval" style="cursor:pointer;font-size:12px;color:#9fb0c0">\ud83e\uddea \u6d4b\u8bd5</span>'+
 '<select id="asPrec" style="background:#1a1f28;color:#e6ecf2;border:1px solid #3a3f4a;'+
 'border-radius:4px;font-size:12px;padding:2px 6px;cursor:pointer">'+
 '<option value="std">\u6807\u51c6</option>'+
 '<option value="acc">\u7cbe\u5ea6\u4f18\u5148</option>'+
 '<option value="expr">\u8868\u73b0\u4f18\u5148</option></select>'+
 '<select id="asPrec" style="background:#1a1f28;color:#e6ecf2;border:1px solid #3a3f4a;'+
 'border-radius:4px;font-size:12px;padding:2px 6px;cursor:pointer">'+
 '<option value="std">\u6807\u51c6</option>'+
 '<option value="acc">\u7cbe\u5ea6\u4f18\u5148</option>'+
 '<option value="expr">\u8868\u73b0\u4f18\u5148</option></select>'+
 '<span style="font-size:10px;opacity:.5" title="\u7cbe\u5ea6\u4f18\u5148\u5173\u95ed\u4f24\u7cbe\u5ea6\u7684\u89c4\u5219\u6539\u5199\uff0c\u8868\u73b0\u4f18\u5148\u5f00\u542f\u91cf\u5316">\u63d0\u793a</span>'+
 '<span id="asQRetry" style="cursor:pointer;font-size:12px;color:#e0c98a">'+
 '\u21bb\u91cd\u8bd5\u5931\u8d25</span>'+

 '<button id="asQAdd" style="cursor:pointer">\uff0b \u52a0\u5165\u961f\u5217</button>'+
 '<span style="font-size:11px;opacity:.55">\u63d0\u793a/\u63d0\u793a\u97f3/\u7f6e\u4fe1\u5ea6/\u4e0b\u8f7d\u9009\u9879\u5728 \u2699 \u8bbe\u7f6e\u91cc</span>'+
 '</div></div>'+
 '<pre id="asLogBox" style="display:none;margin-top:6px;max-height:180px;overflow:auto;'+
 'background:#0d0f14;border:1px solid #2a2f3a;border-radius:6px;padding:8px;'+

if(input&&input.parentNode){
  input.parentNode.insertBefore(obar,input.nextSibling);
  input.parentNode.insertBefore(panel,obar.nextSibling);
}else{document.body.appendChild(obar);document.body.appendChild(panel);}
var chkItem={get checked(){return ls('as_autodl')!=='0';}};
var chkZip={get checked(){return ls('as_zipmode')!=='0';}};
function getThr(){var v=parseFloat(ls('as_thresh')||'0.3');return v>0?v:0.3;}
var list=el('asQList'),body=el('asQBody'),fold=el('asQFold');
try{if(ls('as_qfold')==='1'){body.style.display='none';fold.textContent='\u25b8';}}catch(e){}
fold.onclick=function(){var open=body.style.display!=='none';
  body.style.display=open?'none':'';fold.textContent=open?'\u25b8':'\u25be';
  ls('as_qfold',open?'1':'0');};
el('asQLog').onclick=function(){var box=el('asLogBox');
  logOpen=(box.style.display==='none');
  box.style.display=logOpen?'':'none';
  if(logOpen)fetchLog();};
function esc(x){return String(x).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var Q=[],busy=false,cur=null,phase='idle',t0=0,prevId='',dragIdx=-1,
    draining=false,lastFail=0;

 btn.style.cssText='cursor:pointer;padding:4px 10px;font-size:12px;margin-left:8px';
 var anchor=el('asEvReload')||el('asEvAll')||el('asEvTable');
 var done=false;
 if(anchor&&anchor.parentNode){
  if(anchor.nextSibling)anchor.parentNode.insertBefore(btn,anchor.nextSibling);
  else anchor.parentNode.appendChild(btn);
  done=true;}
 if(!done){var tb=el('asEvTable');
  if(tb&&tb.parentNode)tb.parentNode.insertBefore(btn,tb);
  else{var m=el('asEvalModal');if(m)m.appendChild(btn);}}}
btn.onclick=function(){
 msg('\u83b7\u53d6\u4e2d...',true);
 fetch('/api/eval/best',{cache:'no-store'}).then(function(r){return r.json();})
 .then(function(j){
  if(!j||!j.ok){msg('\u6682\u65e0\u53ef\u7528\u7684\u8bc4\u6d4b\u7ed3\u679c: '+
   ((j&&j.reason)||'\u8bf7\u5148\u8fd0\u884c\u4e00\u6b21\u8bc4\u6d4b'),false);return;}
  var combo=j.combo||{};var onN=0,offN=0,missing=[];
  Object.keys(combo).forEach(function(k){
   var chip=el('adv_'+k);
   if(chip){
    if(chip.checked!==!!combo[k]){chip.checked=!!combo[k];
     chip.dispatchEvent(new Event('change',{bubbles:true}));}
    if(combo[k])onN++;else offN++;}
   else missing.push(k);
   var sw=document.querySelector('#asEvKeys input[data-k="'+k+'"]');
   if(sw&&sw.checked!==!!combo[k]){sw.checked=!!combo[k];
    sw.dispatchEvent(new Event('change',{bubbles:true}));}});
  var t='\u5df2\u5e94\u7528\u6700\u4f18\u7ec4\u5408 (\u7efc\u5408='+j.score+
   '): \u5f00 '+onN+' \u9879 / \u5173 '+offN+' \u9879';
  if(j.rolled_back)t+=' [\u6ce8: \u8be5\u7ec4\u5408\u542b\u56de\u6eda\u673a\u5236]';
  if(missing.length)t+='; \u672a\u627e\u5230\u82af\u7247: '+missing.join(',');
  msg(t,true);})
 .catch(function(e){msg('\u83b7\u53d6\u5931\u8d25: '+e.message,false);});};
})();
</script>
</body>
</html>
